ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /niihan/wheel/odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    imu0: /niihan/imu/data
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 20
    # Game rotation yaw is relative; do not fuse it as absolute north heading.
    imu0_remove_gravitational_acceleration: true
    print_diagnostics: true
    reset_on_time_jump: true

ekf_gnss:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: false
    map_frame: gnss_local
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: gnss_local
    odom0: /niihan/gnss/odometry
    odom0_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    # Auxiliary global position estimate. It must not compete with SLAM for map TF.
    print_diagnostics: true
    reset_on_time_jump: true
