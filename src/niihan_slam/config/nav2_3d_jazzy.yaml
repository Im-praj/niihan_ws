# Jazzy native Nav2 profile; live simulation acceptance pending.
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    global_frame: map
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    robot_base_frame: base_nav
    rotational_acc_lim: 3.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.1
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    enable_stamped_cmd_vel: false
bt_navigator:
  ros__parameters:
    goal_reached_tol: 0.15
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
    transform_tolerance: 0.8
    global_frame: map
    odom_topic: /odom
    robot_base_frame: base_nav
    use_sim_time: true
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.6
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.2
      inflation_cost_scaling_factor: 3.0
      lookahead_dist: 0.6
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_lookahead_dist: 0.9
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.03
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.25
      transform_tolerance: 0.8
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Recheck XY after saved-map corrections; yaw is unrestricted.
      stateful: false
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141593
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    progress_checker:
      movement_time_allowance: 30.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    use_sim_time: true
    progress_checker_plugins:
    - progress_checker
    enable_stamped_cmd_vel: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      cliff_layer:
        cliff_scan:
          clearing: false
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.3
          sensor_frame: base_footprint
          topic: /cliff_scan
        enabled: false
        observation_sources: cliff_scan
        plugin: nav2_costmap_2d::ObstacleLayer
      footprint: '[[-0.35, -0.25], [-0.35, 0.25], [0.35, 0.25], [0.35, -0.25]]'
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /niihan/geofence_filter_info
        transform_tolerance: 0.8
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.45
          raytrace_max_range: 12.0
          raytrace_min_range: 0.45
          inf_is_valid: true
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - cliff_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_nav
      transform_tolerance: 0.8
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      cliff_layer:
        cliff_scan:
          clearing: false
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.3
          sensor_frame: base_footprint
          topic: /cliff_scan
        enabled: false
        observation_sources: cliff_scan
        plugin: nav2_costmap_2d::ObstacleLayer
      footprint: '[[-0.35, -0.25], [-0.35, 0.25], [0.35, 0.25], [0.35, -0.25]]'
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /niihan/geofence_filter_info
        transform_tolerance: 0.8
      global_frame: odom
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.45
          raytrace_max_range: 12.0
          raytrace_min_range: 0.45
          inf_is_valid: true
          topic: /scan
      plugins:
      - obstacle_layer
      - cliff_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_nav
      transform_tolerance: 0.8
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      use_sim_time: true
      width: 6
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    map_subscribe_transient_local: true
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
    use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_smac_planner::SmacPlanner2D
      # Reach the requested goal cell rather than a nearby substitute.
      tolerance: 0.0
      cost_travel_multiplier: 2.0
      max_planning_time: 0.4
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: true
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 1.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    max_velocity:
    - 1.0
    - 0.0
    - 1.0
    min_velocity:
    - -1.0
    - 0.0
    - -1.0
    odom_duration: 0.1
    odom_topic: /odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
